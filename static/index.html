<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Q&amp;A</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1120;
    --bg-elevated: #121a2e;
    --text: #e8ecf5;
    --text-muted: #9aa5b8;
    --accent: #4f9dff;
    --border: #22304d;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.05rem; font-weight: 700; }
  header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin-bottom: 20px;
    max-width: 85%;
  }
  .msg.user {
    margin-left: auto;
    text-align: right;
  }
  .bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    text-align: left;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: var(--bg);
  }
  .msg.assistant .bubble {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
  }
  .msg.error .bubble {
    background: rgba(255, 90, 90, 0.12);
    border: 1px solid rgba(255, 90, 90, 0.4);
    color: #ff9a9a;
  }
  .msg.pending .bubble {
    color: var(--text-muted);
    font-style: italic;
  }

  form {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <header>
    <h1>Document Q&amp;A</h1>
    <p>Ask questions about the documents in your <code>docs/</code> folder.</p>
  </header>

  <div id="log"></div>

  <form id="form">
    <input id="question" type="text" placeholder="Ask a question…" autocomplete="off" autofocus>
    <button type="submit" id="submit">Ask</button>
  </form>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const submitBtn = document.getElementById("submit");

  // Plain-text history sent back to the server each turn: [{role, content}, ...]
  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage("user", question);
    input.value = "";
    input.disabled = true;
    submitBtn.disabled = true;
    const pending = addMessage("pending", "Thinking…");

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      const data = await res.json();
      pending.remove();

      if (!res.ok) {
        addMessage("error", data.error || "Something went wrong.");
      } else {
        addMessage("assistant", data.answer);
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: data.answer });
      }
    } catch (err) {
      pending.remove();
      addMessage("error", "Could not reach the server: " + err.message);
    } finally {
      input.disabled = false;
      submitBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
